<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1280 640' width='1280' height='640' role='img' aria-label='Camicia'>
  <defs>
    <linearGradient id='felt' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0%' stop-color='#0a1612'/>
      <stop offset='45%' stop-color='#16302a'/>
      <stop offset='100%' stop-color='#0a1612'/>
    </linearGradient>

    <pattern id='lattice' width='56' height='56' patternUnits='userSpaceOnUse' patternTransform='rotate(45)'>
      <line x1='0' y1='0' x2='0' y2='56' stroke='#1d3a32' stroke-width='1.2'/>
    </pattern>
    <pattern id='lattice2' width='56' height='56' patternUnits='userSpaceOnUse' patternTransform='rotate(-45)'>
      <line x1='0' y1='0' x2='0' y2='56' stroke='#1d3a32' stroke-width='1.2'/>
    </pattern>

    <radialGradient id='vignette' cx='50%' cy='50%' r='75%'>
      <stop offset='30%' stop-color='#0a1612' stop-opacity='0'/>
      <stop offset='100%' stop-color='#060d0b' stop-opacity='0.92'/>
    </radialGradient>

    <filter id='soft-shadow' x='-30%' y='-30%' width='160%' height='160%'>
      <feDropShadow dx='0' dy='6' stdDeviation='8' flood-color='#000000' flood-opacity='0.55'/>
    </filter>

    <g id='card'>
      <rect x='0' y='0' width='155' height='220' rx='10' fill='#ede3cb' stroke='#8c7a3e' stroke-width='2.2'/>
      <rect x='10' y='10' width='135' height='200' rx='6' fill='none' stroke='#8c7a3e' stroke-width='1' opacity='0.55'/>
    </g>
  </defs>

  <!-- Background felt & textures -->
  <rect x='0' y='0' width='1280' height='640' fill='url(#felt)'/>
  <rect x='0' y='0' width='1280' height='640' fill='url(#lattice)' opacity='0.75'/>
  <rect x='0' y='0' width='1280' height='640' fill='url(#lattice2)' opacity='0.75'/>
  <rect x='0' y='0' width='1280' height='640' fill='url(#vignette)'/>

  <!-- Gold double frame with strict 44px safe margin on all sides (1280 - 88 = 1192, 640 - 88 = 552) -->
  <rect x='44' y='44' width='1192' height='552' fill='none' stroke='#8c7a3e' stroke-width='1.5'/>
  <rect x='52' y='52' width='1176' height='536' fill='none' stroke='#8c7a3e' stroke-width='0.75' opacity='0.4'/>

  <!-- Left Side: Clean Typography vertically balanced inside safe area -->
  <g transform='translate(100, 220)'>
    <!-- Suits decoration -->
    <g font-family='Georgia, serif' font-size='32' letter-spacing='20' transform='translate(4, 0)'>
      <text x='0' y='0' fill='#ede3cb'>&#9824;</text>
      <text x='44' y='0' fill='#a83349'>&#9829;</text>
      <text x='88' y='0' fill='#a83349'>&#9830;</text>
      <text x='132' y='0' fill='#ede3cb'>&#9827;</text>
    </g>

    <!-- Main Title -->
    <text x='0' y='100' font-family='Georgia, "Palatino Linotype", serif'
          font-size='92' font-weight='bold' fill='#c9a227' letter-spacing='1'>Camicia</text>

    <!-- Subtitle -->
    <text x='4' y='155' font-family='Georgia, serif' font-style='italic' font-size='27' fill='#b7ae95'>
      Beggar-My-Neighbour, dealt every possible way
    </text>
  </g>

  <!-- Right Side: Fanned Cards A K Q J (well inside right safe boundary: rightmost point ~1175px <= 1236px) -->
  <g transform='translate(830, 185)'>
    <!-- Ace of Hearts -->
    <g transform='translate(0, 30) rotate(-22 77 110)' filter='url(#soft-shadow)'>
      <use href='#card'/>
      <text x='22' y='54' font-family='Georgia, serif' font-size='42' font-weight='bold' fill='#16302a'>A</text>
      <text x='22' y='96' font-family='Georgia, serif' font-size='38' fill='#a83349'>&#9829;</text>
    </g>

    <!-- King of Spades -->
    <g transform='translate(50, -5) rotate(-8 77 110)' filter='url(#soft-shadow)'>
      <use href='#card'/>
      <text x='22' y='54' font-family='Georgia, serif' font-size='42' font-weight='bold' fill='#16302a'>K</text>
      <text x='22' y='96' font-family='Georgia, serif' font-size='38' fill='#16302a'>&#9824;</text>
    </g>

    <!-- Queen of Diamonds -->
    <g transform='translate(100, -5) rotate(8 77 110)' filter='url(#soft-shadow)'>
      <use href='#card'/>
      <text x='22' y='54' font-family='Georgia, serif' font-size='42' font-weight='bold' fill='#16302a'>Q</text>
      <text x='22' y='96' font-family='Georgia, serif' font-size='38' fill='#a83349'>&#9830;</text>
    </g>

    <!-- Jack of Clubs -->
    <g transform='translate(150, 30) rotate(22 77 110)' filter='url(#soft-shadow)'>
      <use href='#card'/>
      <text x='22' y='54' font-family='Georgia, serif' font-size='42' font-weight='bold' fill='#16302a'>J</text>
      <text x='22' y='96' font-family='Georgia, serif' font-size='38' fill='#16302a'>&#9827;</text>
    </g>
  </g>
</svg>