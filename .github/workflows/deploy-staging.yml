name: deploy-staging

# Auto-deploys on every push to `staging`, unlike deploy.yml which is
# workflow_dispatch-only. Staging is meant for fast iteration before merging
# into main, so it redeploys the instant something lands here. Runs on its own
# dedicated self-hosted runner (label "staging", not "production") registered on
# the same box as production's runner, with its own checkout directory (~/camicia-staging).
on:
  push:
    branches:
      - staging
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Run test suite before deploying to staging (optional)"
        type: boolean
        default: false
      run_benchmarks:
        description: "Run performance benchmarks (optional)"
        type: boolean
        default: false

# Least privilege: this workflow builds/deploys the project but never
# writes to the repo, a PR, or anything else on GitHub itself.
permissions:
  contents: read

jobs:
  # Cross-compiling the worker for macOS needs a real Apple SDK, so it's
  # built here on ephemeral, GitHub-hosted infrastructure and handed to the
  # deploy job below as an artifact.
  build-macos:
    name: "Build macOS Universal Worker"
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4

      - name: Get pinned BOINC commit
        id: boinc_commit
        run: |
          echo "commit=$(grep -oE 'ARG BOINC_COMMIT=[0-9a-f]+' images/server/Dockerfile | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Cache BOINC lib/api (macOS universal)
        id: cache-boinc-macos
        uses: actions/cache@v4
        with:
          path: boinc-macos
          key: boinc-macos-universal-${{ steps.boinc_commit.outputs.commit }}-min${{ env.MACOSX_DEPLOYMENT_TARGET }}

      - name: Install autotools (not preinstalled on macos-14 runners)
        if: steps.cache-boinc-macos.outputs.cache-hit != 'true'
        run: |
          brew install autoconf automake libtool pkg-config
          echo "$(brew --prefix libtool)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: "Build BOINC lib/api (macOS universal: arm64 + x86_64)"
        if: steps.cache-boinc-macos.outputs.cache-hit != 'true'
        run: |
          git init boinc-src
          cd boinc-src
          git remote add origin https://github.com/BOINC/boinc.git
          git fetch --depth 1 origin "${{ steps.boinc_commit.outputs.commit }}"
          git checkout FETCH_HEAD
          ./_autosetup
          cd ..

          echo "Building BOINC for arm64..."
          cp -r boinc-src boinc-arm64
          cd boinc-arm64
          ./configure --disable-client --disable-manager --disable-server CFLAGS="-arch arm64" CXXFLAGS="-arch arm64"
          make -j$(sysctl -n hw.logicalcpu)
          cd ..

          echo "Building BOINC for x86_64..."
          cp -r boinc-src boinc-x86_64
          cd boinc-x86_64
          ./configure --host=x86_64-apple-darwin --disable-client --disable-manager --disable-server CC=clang CXX=clang++ AR=ar RANLIB=ranlib CFLAGS="-arch x86_64" CXXFLAGS="-arch x86_64" LDFLAGS="-arch x86_64"
          make -j$(sysctl -n hw.logicalcpu)
          cd ..

          echo "Combining architectures with lipo..."
          lipo -create boinc-arm64/api/libboinc_api.a boinc-x86_64/api/libboinc_api.a -output boinc-arm64/api/libboinc_api_univ.a
          mv boinc-arm64/api/libboinc_api_univ.a boinc-arm64/api/libboinc_api.a

          lipo -create boinc-arm64/lib/libboinc.a boinc-x86_64/lib/libboinc.a -output boinc-arm64/lib/libboinc_univ.a
          mv boinc-arm64/lib/libboinc_univ.a boinc-arm64/lib/libboinc.a

          mv boinc-arm64 boinc-macos
          rm -rf boinc-src boinc-x86_64

          lipo -info boinc-macos/api/libboinc_api.a
          lipo -info boinc-macos/lib/libboinc.a

      - name: "Compile Worker (macOS universal: arm64 + x86_64)"
        run: |
          echo "=== Validating Metal Shading Language kernel syntax ==="
          xcrun -sdk macosx metal -c tools/worker/metal/camicia_kernel.metal -o /tmp/camicia_kernel.air
          echo "Metal kernel syntax OK!"

          clang++ -O3 -arch arm64 -arch x86_64 \
            tools/worker/worker.cpp tools/worker/core/*.cpp tools/worker/opencl/*.cpp tools/worker/metal/*.mm \
            -o worker_app_macos \
            -I boinc-macos/api -I boinc-macos/lib \
            -I tools/worker -I tools/worker/core \
            -I tools/worker/opencl -I tools/worker/opencl/include \
            -I tools/worker/metal \
            boinc-macos/api/libboinc_api.a boinc-macos/lib/libboinc.a \
            -framework Metal -framework Foundation \
            -pthread

          lipo -info worker_app_macos
          file worker_app_macos

      - uses: actions/upload-artifact@v4
        with:
          name: worker_app_macos
          path: worker_app_macos
          retention-days: 1

  test-macos:
    name: "Test macOS Worker (Optional)"
    needs: build-macos
    if: ${{ inputs.run_tests }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS worker artifact
        uses: actions/download-artifact@v4
        with:
          name: worker_app_macos

      - name: "Test Worker Execution (arm64 native & x86_64 Rosetta)"
        run: |
          chmod +x worker_app_macos
          echo "=== 1. Testing native arm64 execution (with GPU flag) ==="
          echo "0 1000" > in
          ./worker_app_macos --gpu
          cp out out_arm64_gpu

          echo "=== 2. Testing native arm64 execution (CPU) ==="
          rm -f out checkpoint.txt loops.txt
          echo "0 1000" > in
          ./worker_app_macos --cpu
          cp out out_arm64_cpu

          echo "=== 3. Testing x86_64 execution under Rosetta ==="
          rm -f out checkpoint.txt loops.txt
          echo "0 1000" > in
          arch -x86_64 ./worker_app_macos --cpu
          cp out out_x86_64

          echo "=== 4. Verifying deterministic results match across architectures ==="
          diff -u out_arm64_gpu out_arm64_cpu
          diff -u out_arm64_cpu out_x86_64
          echo "PASS: arm64 GPU, arm64 CPU, and x86_64 Rosetta match byte-for-byte!"
          rm -f in out out_arm64_gpu out_arm64_cpu out_x86_64 checkpoint.txt loops.txt

      - name: "Optional macOS Benchmark"
        if: ${{ inputs.run_benchmarks }}
        run: |
          clang++ -std=c++17 -O3 -arch arm64 -arch x86_64 \
            tests/benchmark.cpp tools/worker/core/*.cpp tools/worker/opencl/*.cpp tools/worker/metal/*.mm \
            -o camicia_bench \
            -I tools/worker -I tools/worker/core \
            -I tools/worker/opencl -I tools/worker/opencl/include \
            -I tools/worker/metal \
            -framework Metal -framework Foundation \
            -pthread
          ./camicia_bench --count 100000 --all --sweep

  test-linux:
    name: "Test Linux Worker (Optional)"
    if: ${{ inputs.run_tests }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Run Core Unit Tests"
        run: |
          g++ -std=c++17 -O2 tests/test_permutation.cpp tools/worker/core/permutation.cpp \
            -o /tmp/test_permutation -I tools/worker/core
          /tmp/test_permutation

          g++ -std=c++17 -O2 -DCAMICIA_TESTING tests/test_engine.cpp \
            tools/worker/core/permutation.cpp tools/worker/core/engine.cpp \
            -o /tmp/test_engine -I tools/worker/core
          /tmp/test_engine

          g++ -std=c++17 -O2 -DCAMICIA_TESTING tests/test_engine_properties.cpp \
            tools/worker/core/permutation.cpp tools/worker/core/engine.cpp \
            -o /tmp/test_engine_properties -I tools/worker/core
          /tmp/test_engine_properties

          g++ -std=c++17 -O2 tests/test_engine_small_deck.cpp \
            tools/worker/core/engine.cpp \
            -o /tmp/test_engine_small_deck -I tools/worker/core
          /tmp/test_engine_small_deck

          bash tests/test_verify_sample.sh

      - name: "Compile and Test Linux Worker Execution"
        run: |
          g++ -std=c++17 -O3 -DCAMICIA_STANDALONE \
            tools/worker/worker.cpp tools/worker/core/*.cpp tools/worker/opencl/*.cpp \
            -o /tmp/worker_linux \
            -I tools/worker -I tools/worker/core -I tools/worker/opencl -I tools/worker/opencl/include \
            -pthread -ldl
          echo "0 1000" > in
          /tmp/worker_linux
          cat out
          rm -f in out checkpoint.txt loops.txt

      - name: "Optional Linux Benchmark"
        if: ${{ inputs.run_benchmarks }}
        run: |
          g++ -std=c++17 -O3 tests/benchmark.cpp tools/worker/core/*.cpp tools/worker/opencl/*.cpp \
            -o /tmp/camicia_bench \
            -I tools/worker -I tools/worker/core -I tools/worker/opencl -I tools/worker/opencl/include -I tools/worker/metal \
            -pthread -ldl
          /tmp/camicia_bench --count 100000 --all

  test-windows:
    name: "Test Windows Worker (Optional)"
    if: ${{ inputs.run_tests }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: "Run Core Unit Tests on Windows"
        run: |
          g++ -std=c++17 -O2 tests/test_permutation.cpp tools/worker/core/permutation.cpp \
            -o test_permutation.exe -I tools/worker/core
          ./test_permutation.exe

          g++ -std=c++17 -O2 -DCAMICIA_TESTING tests/test_engine.cpp \
            tools/worker/core/permutation.cpp tools/worker/core/engine.cpp \
            -o test_engine.exe -I tools/worker/core
          ./test_engine.exe

          g++ -std=c++17 -O2 -DCAMICIA_TESTING tests/test_engine_properties.cpp \
            tools/worker/core/permutation.cpp tools/worker/core/engine.cpp \
            -o test_engine_properties.exe -I tools/worker/core
          ./test_engine_properties.exe

      - name: "Compile and Test Windows Worker Execution"
        run: |
          g++ -std=c++17 -O3 -DCAMICIA_STANDALONE \
            tools/worker/worker.cpp tools/worker/core/*.cpp tools/worker/opencl/*.cpp \
            -o worker_windows.exe \
            -I tools/worker -I tools/worker/core -I tools/worker/opencl -I tools/worker/opencl/include \
            -pthread
          echo "0 1000" > in
          ./worker_windows.exe
          cat out
          rm -f in out checkpoint.txt loops.txt

      - name: "Optional Windows Benchmark"
        if: ${{ inputs.run_benchmarks }}
        run: |
          g++ -std=c++17 -O3 tests/benchmark.cpp tools/worker/core/*.cpp tools/worker/opencl/*.cpp \
            -o camicia_bench.exe \
            -I tools/worker -I tools/worker/core -I tools/worker/opencl -I tools/worker/opencl/include -I tools/worker/metal \
            -pthread
          ./camicia_bench.exe --count 100000 --cpu

  deploy:
    name: "Deploy to Staging"
    needs: [build-macos, test-macos, test-linux, test-windows]
    if: always() && needs.build-macos.result == 'success' && (needs.test-macos.result == 'success' || needs.test-macos.result == 'skipped') && (needs.test-linux.result == 'success' || needs.test-linux.result == 'skipped') && (needs.test-windows.result == 'success' || needs.test-windows.result == 'skipped')
    runs-on: [self-hosted, staging]
    # No `environment:` block, unlike deploy.yml: staging deliberately skips
    # CODE_SIGN_KEY_PASSPHRASE/UPLOAD_KEY_PASSPHRASE entirely (see STAGING.md
    # "Decisions made"), so there is nothing to store as an Environment
    # secret. publish_version.sh's decrypt step only runs when
    # CODE_SIGN_KEY_PASSPHRASE is set; left unset here, it falls back to
    # using code_sign_private directly, exactly the "local dev convenience"
    # path make_project's freshly-generated plaintext key already supports.
    steps:
      - name: Download macOS worker artifact
        uses: actions/download-artifact@v4
        with:
          name: worker_app_macos

      - name: Pull latest staging and redeploy
        run: |
          cd ~/camicia-staging
          git fetch origin staging
          git reset --hard origin/staging
          cp "$GITHUB_WORKSPACE/worker_app_macos" tools/worker/worker_app_macos
          chmod +x tools/worker/worker_app_macos
          bash tools/tools.sh

      - name: Verify deployment health
        run: |
          cd ~/camicia-staging
          docker compose -p camicia-staging ps

          echo "--- daemons ---"
          MISSING=""
          for d in assimilator sample_bitwise_validator work_generator feeder transitioner file_deleter; do
            if docker exec --user boincadm boinc_server_staging pgrep -f "^$d " > /dev/null; then
              echo "OK: $d"
            else
              echo "MISSING: $d is not running"
              MISSING="$MISSING $d"
            fi
          done

          echo "--- user site ---"
          docker exec boinc_server_staging curl -sf -o /dev/null -w 'HTTP %{http_code}\n' http://localhost/camicia/

          if [ -n "$MISSING" ]; then
            echo "Deploy health check FAILED, daemon(s) not running:$MISSING"
            exit 1
          fi

      # Same rollback path as deploy.yml, run against the staging checkout.
      # No CODE_SIGN_KEY_PASSPHRASE to pass through here either, for the same
      # reason as the deploy job above.
      - name: Roll back on health check failure
        if: failure()
        run: |
          cd ~/camicia-staging
          bash tools/tools.sh --restore

      - name: Record deployed commit
        run: |
          # Path suffixed with "camicia-staging" (this checkout's own
          # directory name) to match deploy_rollback.sh's own derivation and
          # deploy.yml's equivalent step for production -- kept in sync
          # manually since this step writes the file directly rather than
          # through that script.
          mkdir -p ~/.camicia_deploy_state_camicia-staging
          cd ~/camicia-staging
          git rev-parse HEAD > ~/.camicia_deploy_state_camicia-staging/deployed_sha
