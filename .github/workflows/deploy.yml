name: deploy

# Manual only, on purpose: this repo is public, and this workflow runs on a
# self-hosted runner living on the actual production machine. It must never
# be reachable via pull_request or any other event a stranger could trigger.
# The `production` Environment additionally requires a manual approval click
# before the job is allowed to start on the runner (Settings > Environments).
on:
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: "Build/test worker binaries only -- skip the actual production deploy (leaves the self-hosted deploy job skipped, not queued)"
        type: boolean
        default: false

jobs:
  # Ephemeral, GitHub-hosted -- runs on real Apple hardware (Apple SDK EULA's
  # "Apple-branded hardware only" clause), unlike the Windows/Linux ARM64
  # workers which are cross-compiled straight inside the production
  # container. macOS can't be reliably cross-compiled without an Apple SDK,
  # so this builds the worker binary elsewhere and hands it to the deploy
  # job below as an artifact. Doesn't touch prod, so no `environment:` gate.
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # BOINC's own lib/api rarely changes (only when BOINC_COMMIT is
      # deliberately bumped in images/server/Dockerfile), unlike worker.cpp
      # which can change on every deploy -- rebuilding it from source is
      # ~2 minutes of this job's ~2.5, so it's cached separately, keyed on
      # that commit, from the actual worker compile below (a few seconds).
      - name: Get pinned BOINC commit
        id: boinc_commit
        run: |
          echo "commit=$(grep -oE 'ARG BOINC_COMMIT=[0-9a-f]+' images/server/Dockerfile | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Cache BOINC lib/api (macOS arm64)
        id: cache-boinc-macos
        uses: actions/cache@v4
        with:
          path: boinc-macos
          key: boinc-macos-arm64-${{ steps.boinc_commit.outputs.commit }}

      - name: Install autotools (not preinstalled on macos-14 runners)
        if: steps.cache-boinc-macos.outputs.cache-hit != 'true'
        run: |
          brew install autoconf automake libtool pkg-config
          # BOINC's _autosetup expects GNU-named libtool/libtoolize, but
          # Homebrew installs them as glibtool/glibtoolize to avoid
          # clobbering Apple's own bundled libtool -- prepend the gnubin
          # shim dir so the unprefixed names resolve.
          echo "$(brew --prefix libtool)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Build BOINC lib/api (macOS arm64, native)
        if: steps.cache-boinc-macos.outputs.cache-hit != 'true'
        run: |
          git init boinc-macos
          cd boinc-macos
          git remote add origin https://github.com/BOINC/boinc.git
          git fetch --depth 1 origin "${{ steps.boinc_commit.outputs.commit }}"
          git checkout FETCH_HEAD
          ./_autosetup
          ./configure --disable-client --disable-manager --disable-server
          make

      - name: Compile Worker (macOS arm64)
        run: |
          # No -static: Apple doesn't support fully static executables
          # (no crt0.o to link against libSystem statically). No -ldl:
          # dlopen/dlsym are part of libSystem on macOS, no separate libdl
          # to link (same reason the Windows build already omits it).
          clang++ -O3 \
            tools/worker/worker.cpp tools/worker/core/*.cpp \
            -o worker_app_macos \
            -I boinc-macos/api -I boinc-macos/lib \
            -I tools/worker -I tools/worker/core \
            boinc-macos/api/libboinc_api.a boinc-macos/lib/libboinc.a \
            -pthread

      - uses: actions/upload-artifact@v4
        with:
          name: worker_app_macos
          path: worker_app_macos
          retention-days: 1

  deploy:
    needs: build-macos
    if: ${{ !inputs.skip_deploy }}
    runs-on: [self-hosted, production]
    environment: production
    steps:
      - name: Download macOS worker artifact
        uses: actions/download-artifact@v4
        with:
          name: worker_app_macos

      - name: Pull latest main and redeploy
        env:
          # keys/code_sign_private is kept encrypted at rest on production;
          # tools.sh decrypts it only for the brief window update_versions
          # needs it, using this secret -- never written to production's
          # .env, only present in this step's process environment for the
          # duration of the run. See DEPLOYMENT.md for the one-time setup
          # this depends on.
          CODE_SIGN_KEY_PASSPHRASE: ${{ secrets.CODE_SIGN_KEY_PASSPHRASE }}
          # keys/rclone.conf (the offsite-backup Google Drive remote) is also
          # encrypted at rest on production, same reasoning as above -- never
          # written to production's .env, only present in this step's process
          # environment for the duration of the run. No local-.env equivalent
          # exists on purpose: unlike code-signing, there's no local-dev
          # backup to protect, so local runs simply have this unset and the
          # backup script no-ops.
          RCLONE_CONFIG_PASS: ${{ secrets.RCLONE_CONFIG_PASS }}
          # keys/upload_private.gpg is the encrypted backup of a key that,
          # unlike code_sign_private, must actually stay plaintext on disk
          # continuously -- sched/transitioner.cpp reads it unconditionally
          # at daemon startup (confirmed 2026-08-20 after encrypting it broke
          # transitioner in production for about an hour). tools.sh only uses
          # this to self-heal the plaintext file back if it's ever missing,
          # not a decrypt-use-re-hide cycle -- see tools.sh's own comment.
          UPLOAD_KEY_PASSPHRASE: ${{ secrets.UPLOAD_KEY_PASSPHRASE }}
        run: |
          cd ~/camicia
          git fetch origin main
          git reset --hard origin/main
          # Placed here, before tools.sh runs its own `docker cp ./worker ...`
          # (which copies the whole tools/worker/ directory into the
          # container as-is): this way the mac binary rides along
          # automatically, no new docker cp needed. chmod +x explicitly --
          # the executable bit isn't guaranteed to survive the
          # upload-artifact/download-artifact zip transfer across runner OSes.
          cp "$GITHUB_WORKSPACE/worker_app_macos" tools/worker/worker_app_macos
          chmod +x tools/worker/worker_app_macos
          bash tools/tools.sh

      - name: Verify deployment health
        run: |
          cd ~/camicia
          docker compose ps

          # Each of config.xml's <daemons> by name, not a substring grep --
          # the previous version of this check only printed whatever ps aux
          # happened to match (and didn't even list file_deleter), with no
          # assertion, so a real daemon outage (transitioner, 2026-08-20 --
          # ~1 hour undetected) produced a green run anyway. Fail loudly
          # instead: this run's own exit code is now the actual detector.
          echo "--- daemons ---"
          MISSING=""
          for d in assimilator sample_bitwise_validator work_generator feeder transitioner file_deleter; do
            if docker exec --user boincadm boinc_server pgrep -f "^$d " > /dev/null; then
              echo "OK: $d"
            else
              echo "MISSING: $d is not running"
              MISSING="$MISSING $d"
            fi
          done

          echo "--- user site ---"
          docker exec boinc_server curl -sf -o /dev/null -w 'HTTP %{http_code}\n' http://localhost/camicia/

          if [ -n "$MISSING" ]; then
            echo "Deploy health check FAILED, daemon(s) not running:$MISSING"
            exit 1
          fi
