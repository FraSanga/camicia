name: deploy

# Manual only, on purpose: this repo is public, and this workflow runs on a
# self-hosted runner living on the actual production machine. It must never
# be reachable via pull_request or any other event a stranger could trigger.
# The `production` Environment additionally requires a manual approval click
# before the job is allowed to start on the runner (Settings > Environments).
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, production]
    environment: production
    steps:
      - name: Pull latest main and redeploy
        env:
          # keys/code_sign_private is kept encrypted at rest on production;
          # tools.sh decrypts it only for the brief window update_versions
          # needs it, using this secret -- never written to production's
          # .env, only present in this step's process environment for the
          # duration of the run. See DEPLOYMENT.md for the one-time setup
          # this depends on.
          CODE_SIGN_KEY_PASSPHRASE: ${{ secrets.CODE_SIGN_KEY_PASSPHRASE }}
          # keys/rclone.conf (the offsite-backup Google Drive remote) is also
          # encrypted at rest on production, same reasoning as above -- never
          # written to production's .env, only present in this step's process
          # environment for the duration of the run. No local-.env equivalent
          # exists on purpose: unlike code-signing, there's no local-dev
          # backup to protect, so local runs simply have this unset and the
          # backup script no-ops.
          RCLONE_CONFIG_PASS: ${{ secrets.RCLONE_CONFIG_PASS }}
          # keys/upload_private.gpg is the encrypted backup of a key that,
          # unlike code_sign_private, must actually stay plaintext on disk
          # continuously -- sched/transitioner.cpp reads it unconditionally
          # at daemon startup (confirmed 2026-08-20 after encrypting it broke
          # transitioner in production for about an hour). tools.sh only uses
          # this to self-heal the plaintext file back if it's ever missing,
          # not a decrypt-use-re-hide cycle -- see tools.sh's own comment.
          UPLOAD_KEY_PASSPHRASE: ${{ secrets.UPLOAD_KEY_PASSPHRASE }}
        run: |
          cd ~/camicia
          git fetch origin main
          git reset --hard origin/main
          bash tools/tools.sh

      - name: Verify deployment health
        run: |
          cd ~/camicia
          docker compose ps
          echo "--- daemons ---"
          docker exec --user boincadm boinc_server bash -c \
            "ps aux | grep -E 'assimilator|work_generator|feeder|transitioner|validator' | grep -v grep"
          echo "--- user site ---"
          docker exec boinc_server curl -sf -o /dev/null -w 'HTTP %{http_code}\n' http://localhost/camicia/
