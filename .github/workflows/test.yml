name: test

on:
  push:
  pull_request:

# Least privilege: this workflow only compiles and runs local test binaries,
# never writes to the repo, a PR, or anything else on GitHub.
permissions:
  contents: read

jobs:
  linux-tests:
    name: "Linux Tests (x86_64)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run permutation tests
        run: |
          g++ -std=c++17 -O2 tests/test_permutation.cpp tools/worker/core/permutation.cpp \
            -o /tmp/test_permutation -I tools/worker/core
          /tmp/test_permutation

      - name: Build and run engine tests
        run: |
          g++ -std=c++17 -O2 -DCAMICIA_TESTING tests/test_engine.cpp \
            tools/worker/core/permutation.cpp tools/worker/core/engine.cpp \
            -o /tmp/test_engine -I tools/worker/core
          /tmp/test_engine

      - name: Build and run engine property tests
        run: |
          g++ -std=c++17 -O2 -DCAMICIA_TESTING tests/test_engine_properties.cpp \
            tools/worker/core/permutation.cpp tools/worker/core/engine.cpp \
            -o /tmp/test_engine_properties -I tools/worker/core
          /tmp/test_engine_properties

      - name: Build and run engine small-deck test
        run: |
          g++ -std=c++17 -O2 tests/test_engine_small_deck.cpp \
            tools/worker/core/engine.cpp \
            -o /tmp/test_engine_small_deck -I tools/worker/core
          /tmp/test_engine_small_deck

      - name: Build and run verify_sample integration test
        run: bash tests/test_verify_sample.sh

      - name: Build and run Linux worker execution test
        run: |
          g++ -std=c++17 -O3 -DCAMICIA_STANDALONE \
            tools/worker/worker.cpp tools/worker/core/*.cpp tools/worker/opencl/*.cpp \
            -o /tmp/worker_linux \
            -I tools/worker -I tools/worker/core -I tools/worker/opencl -I tools/worker/opencl/include \
            -pthread -ldl
          echo "0 1000" > in
          /tmp/worker_linux
          cat out
          rm -f in out checkpoint.txt loops.txt

  macos-tests:
    name: "macOS Tests (arm64 & x86_64 Rosetta)"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Build and run permutation tests (arm64 & x86_64)"
        run: |
          clang++ -std=c++17 -O2 -arch arm64 tests/test_permutation.cpp tools/worker/core/permutation.cpp \
            -o /tmp/test_perm_arm64 -I tools/worker/core
          /tmp/test_perm_arm64

          clang++ -std=c++17 -O2 -arch x86_64 tests/test_permutation.cpp tools/worker/core/permutation.cpp \
            -o /tmp/test_perm_x86_64 -I tools/worker/core
          arch -x86_64 /tmp/test_perm_x86_64

      - name: "Build and run engine tests (arm64 & x86_64)"
        run: |
          clang++ -std=c++17 -O2 -arch arm64 -DCAMICIA_TESTING tests/test_engine.cpp \
            tools/worker/core/permutation.cpp tools/worker/core/engine.cpp \
            -o /tmp/test_eng_arm64 -I tools/worker/core
          /tmp/test_eng_arm64

          clang++ -std=c++17 -O2 -arch x86_64 -DCAMICIA_TESTING tests/test_engine.cpp \
            tools/worker/core/permutation.cpp tools/worker/core/engine.cpp \
            -o /tmp/test_eng_x86_64 -I tools/worker/core
          arch -x86_64 /tmp/test_eng_x86_64

      - name: "Build and run engine property tests (arm64 & x86_64)"
        run: |
          clang++ -std=c++17 -O2 -arch arm64 -DCAMICIA_TESTING tests/test_engine_properties.cpp \
            tools/worker/core/permutation.cpp tools/worker/core/engine.cpp \
            -o /tmp/test_props_arm64 -I tools/worker/core
          /tmp/test_props_arm64

          clang++ -std=c++17 -O2 -arch x86_64 -DCAMICIA_TESTING tests/test_engine_properties.cpp \
            tools/worker/core/permutation.cpp tools/worker/core/engine.cpp \
            -o /tmp/test_props_x86_64 -I tools/worker/core
          arch -x86_64 /tmp/test_props_x86_64

      - name: "Compile and run macOS worker execution test"
        run: |
          clang++ -std=c++17 -O3 -arch arm64 -arch x86_64 -DCAMICIA_STANDALONE \
            tools/worker/worker.cpp tools/worker/core/*.cpp tools/worker/opencl/*.cpp tools/worker/metal/*.mm \
            -o /tmp/worker_macos \
            -I tools/worker -I tools/worker/core \
            -I tools/worker/opencl -I tools/worker/opencl/include \
            -I tools/worker/metal \
            -framework Metal -framework Foundation \
            -pthread

          echo "=== 1. Native arm64 GPU ==="
          echo "0 1000" > in
          /tmp/worker_macos --gpu
          cp out out_arm64_gpu

          echo "=== 2. Native arm64 CPU ==="
          rm -f out checkpoint.txt loops.txt
          echo "0 1000" > in
          /tmp/worker_macos --cpu
          cp out out_arm64_cpu

          echo "=== 3. Rosetta x86_64 CPU ==="
          rm -f out checkpoint.txt loops.txt
          echo "0 1000" > in
          arch -x86_64 /tmp/worker_macos --cpu
          cp out out_x86_64

          echo "=== 4. Cross-architecture Determinism ==="
          diff -u out_arm64_gpu out_arm64_cpu
          diff -u out_arm64_cpu out_x86_64
          echo "PASS: macOS arm64 GPU, arm64 CPU, and x86_64 Rosetta match!"
          rm -f in out out_arm64_gpu out_arm64_cpu out_x86_64 checkpoint.txt loops.txt

  windows-tests:
    name: "Windows Tests (x86_64)"
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Build and run permutation tests on Windows
        run: |
          g++ -std=c++17 -O2 tests/test_permutation.cpp tools/worker/core/permutation.cpp \
            -o test_permutation.exe -I tools/worker/core
          ./test_permutation.exe

      - name: Build and run engine tests on Windows
        run: |
          g++ -std=c++17 -O2 -DCAMICIA_TESTING tests/test_engine.cpp \
            tools/worker/core/permutation.cpp tools/worker/core/engine.cpp \
            -o test_engine.exe -I tools/worker/core
          ./test_engine.exe

      - name: Build and run engine property tests on Windows
        run: |
          g++ -std=c++17 -O2 -DCAMICIA_TESTING tests/test_engine_properties.cpp \
            tools/worker/core/permutation.cpp tools/worker/core/engine.cpp \
            -o test_engine_properties.exe -I tools/worker/core
          ./test_engine_properties.exe

      - name: Build and run Windows worker execution test
        run: |
          g++ -std=c++17 -O3 -DCAMICIA_STANDALONE \
            tools/worker/worker.cpp tools/worker/core/*.cpp tools/worker/opencl/*.cpp \
            -o worker_windows.exe \
            -I tools/worker -I tools/worker/core -I tools/worker/opencl -I tools/worker/opencl/include \
            -pthread
          echo "0 1000" > in
          ./worker_windows.exe
          cat out
          rm -f in out checkpoint.txt loops.txt
