services:
  server:
    build:
      context: ./images/server
      dockerfile: Dockerfile
      args:
        - PROJECTS_USER=${PROJECTS_USER}
        - SERVER_VOLUME_PROJECTS_DIR=${SERVER_VOLUME_PROJECTS_DIR}
    container_name: ${SERVER_CONTAINER_NAME}
    hostname: ${SERVER_HOSTNAME}
    restart: unless-stopped
    environment:
      OPS_USER: ${OPS_USER}
      OPS_PASS: ${OPS_PASS}
      SERVER_VOLUME_PROJECTS_DIR: ${SERVER_VOLUME_PROJECTS_DIR}
      PROJECTS_USER: ${PROJECTS_USER}
      SERVER_HOSTNAME: ${SERVER_HOSTNAME}
      DOMAIN: ${DOMAIN}
    ports:
      - "${SERVER_PORTS}"
    volumes:
      - ${SERVER_VOLUME_PROJECTS}:${SERVER_VOLUME_PROJECTS_DIR}
      - ${SERVER_VOLUME_KEYS}:${SERVER_VOLUME_KEYS_DIR}
    networks:
      - database_network
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # Conservative starting points, not precisely tuned: bound a runaway
    # process (e.g. from untrusted client-submitted result files, or a
    # request flood) from exhausting the host, which would also affect the
    # database container since they share it. Idle usage is well under
    # 100MiB; revisit if real load ever approaches these.
    mem_limit: 2g
    pids_limit: 512

  database:
    image: mariadb:11.8
    container_name: ${DATABASE_CONTAINER_NAME}
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - database_volume:/var/lib/mysql
    networks:
      - database_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Same rationale as server's limits above. If the workunit/result tables
    # grow large enough for this to matter, raise it deliberately rather than
    # leaving it unbounded.
    mem_limit: 2g
    pids_limit: 256

  # Cloudflare Tunnel: exposes the server service publicly without opening
  # any inbound port on the host/router (cloudflared only makes outbound
  # connections to Cloudflare's edge). Disabled by default (profile-gated)
  # until CLOUDFLARE_TUNNEL_TOKEN is set in .env — see DEPLOYMENT.md.
  # Start with: docker compose --profile cloudflare up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ${SERVER_CONTAINER_NAME}_cloudflared
    restart: unless-stopped
    profiles:
      - cloudflare
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - database_network
    depends_on:
      server:
        condition: service_healthy

networks:
  database_network:
    name: ${DATABASE_NETWORK}
    driver: bridge

volumes:
  database_volume:
    name: ${DATABASE_VOLUME}
